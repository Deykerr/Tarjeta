<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felices Fiestas y Próspero Año Nuevo!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #141e18; /* Fondo oscuro elegante que resalta las luces */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            overflow-x: hidden;
        }
        .card-container {
            max-width: 850px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            animation: aparecer 1.2s ease-out;
            border: 2px solid #d4af37; /* Borde dorado sutil */
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-descargar {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #d4af37;
            color: #141e18;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-descargar:hover {
            transform: scale(1.05);
            background-color: #e5c158;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <img src="tarjeta.jpg" alt="Tarjeta de felicitación de Año Nuevo y Navidad">
    </div>

    <a href="tarjeta.jpg" download="Felicitaciones_2027.jpg" class="btn-descargar">
        Descargar Tarjeta
    </a>

</body>
</html>
